# Every change must build, lint and pass the tests on Linux, macOS and Windows. The tests
# run the whole wizard against the simulator, so no audio hardware is needed. A port to
# one OS that breaks another fails here: see AGENTS.md.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all --check
      # With the window (the default). Without a GPU on the runner, the window's test times
      # the CPU's part only.
      - name: Lint
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test
      - name: The window's times
        run: cargo test --test window -- --nocapture
      # A build without the window (--no-default-features), for the terminal only.
      - name: Lint without the window
        run: cargo clippy --all-targets --no-default-features -- -D warnings
      - name: Test without the window
        run: cargo test --no-default-features --lib

  # The web page (docs/try/): the library and the page's program built for WebAssembly.
  web:
    name: web page
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.130
      - name: Lint
        run: cargo clippy -p correctsound-web --target wasm32-unknown-unknown -- -D warnings
      - name: Build
        run: ./web/build.sh
