[package]
name = "correctsound-web"
version = "0.4.2"
edition = "2024"
description = "CorrectSound in a web page: the simulator, drawn on a canvas"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[target.'cfg(target_family = "wasm")'.dependencies]
ab_glyph = "0.2.32"
# Without the window, which is not built for a web page.
correctsound = { path = "..", default-features = false }
image = { version = "0.25.10", default-features = false }
ratatui = { version = "0.30.2", default-features = false, features = ["std"] }
# The version must match the wasm-bindgen tool that builds the page (web/build.sh).
wasm-bindgen = "=0.2.130"
web-sys = { version = "0.3.107", features = [
    "CanvasRenderingContext2d",
    "console",
    "CssStyleDeclaration",
    "Document",
    "Element",
    "HtmlCanvasElement",
    "HtmlElement",
    "ImageData",
    "KeyboardEvent",
    "Performance",
    "Window",
] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
