<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Try CorrectSound</title>
<meta name="description" content="CorrectSound in your browser: the whole wizard against a simulated room, with the same screens and keys as in the terminal. Nothing is played or recorded.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231a1b26'/%3E%3Cpath d='M4 20 Q9 6 13 18 T22 14 T28 16' fill='none' stroke='%237dcfff' stroke-width='2.6' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
:root {
  --bg: #1a1b26;
  --bar: #16161e;
  --line: #2f3549;
  --fg: #c0caf5;
  --muted: #737aa2;
  --accent: #7dcfff;
  --red: #f7768e;
  --sans: system-ui, -apple-system, "Segoe UI", sans-serif;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  display: flex;
  flex-direction: column;
  background: var(--bg);
  color: var(--fg);
  font: 14px/1.4 var(--sans);
}
header {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: 4px 18px;
  padding: 8px 16px;
  background: var(--bar);
  border-bottom: 1px solid var(--line);
}
header strong { font-weight: 650; }
header .note { color: var(--muted); flex: 1; min-width: 0; }
header a { color: var(--accent); text-decoration: none; white-space: nowrap; }
header a:hover { text-decoration: underline; }
#status { color: var(--red); }
#status:empty { display: none; }
main { flex: 1; min-height: 0; position: relative; }
canvas { display: block; width: 100%; height: 100%; outline: none; }
#loading {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  color: var(--muted);
}
.touch { display: none; }
@media (pointer: coarse) { .touch { display: inline; } }
</style>
</head>
<body>
<header>
  <strong>CorrectSound</strong>
  <span class="note">
    A simulated room: the whole wizard, with the keys of the terminal. Nothing is played or
    recorded. Press <b>i</b> for help.
    <span class="touch">It needs a keyboard.</span>
  </span>
  <span id="status"></span>
  <a href="../#install">Install it for your speakers</a>
</header>
<main>
  <canvas id="screen" tabindex="0" aria-label="CorrectSound, a simulated measurement"></canvas>
  <div id="loading">Loading…</div>
</main>
<script type="module">
import init, { start } from './pkg/correctsound_web.js';

const status = document.getElementById('status');
const loading = document.getElementById('loading');
const family = 'CorrectSound Mono';
try {
  const [, font] = await Promise.all([
    init(),
    fetch('JetBrainsMono-Regular.ttf').then((r) => {
      if (!r.ok) throw new Error(`the font did not load (${r.status})`);
      return r.arrayBuffer();
    }),
  ]);
  // One character per cell, as in a terminal: no ligatures joining them.
  const face = new FontFace(family, font, { featureSettings: '"liga" 0, "calt" 0' });
  document.fonts.add(await face.load());
  loading.remove();
  const canvas = document.getElementById('screen');
  start(canvas, new Uint8Array(font), family);
  canvas.focus();
} catch (e) {
  loading.remove();
  status.textContent = `This browser could not start CorrectSound: ${e.message ?? e}`;
}
</script>
</body>
</html>
