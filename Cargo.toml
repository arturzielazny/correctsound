[package]
name = "correctsound"
version = "0.4.0"
edition = "2024"
description = "Room correction for Linux: measure speakers with a UMIK-1 and load the EQ into EasyEffects, in a terminal wizard"
license = "MIT"
repository = "https://github.com/arturzielazny/correctsound"
homepage = "https://arturzielazny.github.io/correctsound/"
readme = "README.md"
keywords = ["audio", "room-correction", "pipewire", "easyeffects", "equalizer"]
categories = ["multimedia::audio", "command-line-utilities"]

[workspace]
# The app in a web page (stage 1: the simulator), built for WebAssembly: see web/README.md.
members = ["web"]

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
ab_glyph = "0.2.32"
hound = "3.5.1"
image = { version = "0.25.10", default-features = false }
# Without a terminal backend: the library also runs in a web page, which has no terminal.
ratatui = { version = "0.30.2", default-features = false, features = ["std", "layout-cache", "macros", "underline-color", "all-widgets"] }
realfft = "3.5.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tiny-skia = "0.12.0"
toml = "1.2.1"
# The clock: the standard library's everywhere but in a web page, which has its own.
web-time = "1.1.0"

# What only an installed program has: a terminal, signals, downloads over the network
# (a web page has none of them; see src/background.rs and src/files.rs for threads and files).
[target.'cfg(not(target_family = "wasm"))'.dependencies]
clap = { version = "4.6.7", features = ["derive"] }
crossterm = "0.29.0"
ratatui = { version = "0.30.2", features = ["crossterm"] }
ratatui-image = { version = "11.1.0", default-features = false, features = ["crossterm"] }
signal-hook = "0.4.6"
ureq = "3.5.2"
# The window (the default way to show the app): drawn on the GPU, all in Rust. A cargo
# feature, on by default, so a build can leave it out (--no-default-features).
pollster = { version = "1.0.2", optional = true }
vello = { version = "0.12.0", optional = true, default-features = false, features = ["wgpu"] }
# Only the GPU interfaces vello supports: Vulkan (Linux, Windows), Metal (macOS), DirectX 12
# (Windows). wgpu picks its interface at run time, so one left in is compiled in whether it
# is used or not; OpenGL is left out (vello does not support it), 0.6 MB less.
wgpu = { version = "30.0.2", optional = true, default-features = false, features = ["std", "parking_lot", "vulkan", "metal", "dx12", "wgsl"] }
winit = { version = "0.30.13", optional = true }

# In a web page the date and time come from the browser.
[target.'cfg(target_family = "wasm")'.dependencies]
chrono = { version = "0.4.45", features = ["wasmbind"] }

[features]
default = ["window"]
window = ["dep:pollster", "dep:vello", "dep:wgpu", "dep:winit"]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.test]
opt-level = 2

# The released binaries: without symbols they are a third the size.
[profile.release]
strip = true

[dev-dependencies]
# PNG output for examples/screenshots.rs only.
image = { version = "0.25.10", default-features = false, features = ["png"] }

# What releases are built with (`--profile dist`): slower to build, smaller and as fast.
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1

# The web page's program (web/build.sh): as small as `dist`, with the section wasm-bindgen
# reads which WebAssembly features it may use.
[profile.web]
inherits = "dist"
strip = "debuginfo"
